<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SingIn</title>
    <link href="./style.css" rel="stylesheet"/>
</head>
<body>
    <div class="container">
        <!-- Section Inner div -->
        <div class="singin">
            <div class="singin-title">
                Sing In
            </div>

            <!-- From Section -->
             <form>
                <div class="form-controller">
                    <input type="text" placeholder="Username"  class="imp"/>
                </div>
                <div class="form-controller">
                    <input type="password" placeholder="password" class="imp" />
                    <span class="help-text fp">Forget Password ?</span>
                </div>
                <!-- Horizontal Row -->
                 <hr>
                <button class="btn submit">
                    Sing In
                </button>
             </form>
             <div class="help-text or-text">OR Sing In</div>
             <button class="btn google">
                <img src="./google.svg" alt="google" class="icons"/><span>Sing In With Google Plus</span>
            </button>
            <button class="btn fb">
                <img src="./facebook.svg" alt="facebook" class="icons"/><span> Sing In With Facebook</span>
            </button>
        </div>
    </div>
</body>
</html>
