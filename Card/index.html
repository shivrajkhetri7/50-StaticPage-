<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script
      src="https://kit.fontawesome.com/a076d05399.js"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Card</title>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="card-header">
          <div class="card-profile">
            <img
              src="./Shivraj.jpg"
              width="100"
              height="100"
              alt="Profile Picture"
              class="img-dp"
            />
          </div>
          <div class="card-profile-name">Shivraj Khetri</div>
          <div class="card-profile-subtitle">( Software Engineer )</div>
        </div>
        <div class="card-body">
          <!-- Card Body -->
          <div class="description">
            Lorem ipsum dolor, sit amet consectetur adipisicing elit. Ullam,
            veritatis. Ullam repellendus at eaque tempore consequatur a eos
            error officia ipsum ipsa, odit aspernatur nesciunt deserunt id
            pariatur est? Obcaecati.
          </div>
        </div>
        <div class="card-footer">
          <button>
            Read More <i style="font-size: 18px" class="fas">&#xf061;</i>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
